<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mary Grow Box</title>
<style>
  :root{--bg:#0a100d;--panel:#111a15;--panel2:#0e1512;--line:#22322a;--green:#6EE7A8;--green-dim:#3f7a5c;--amber:#f0a868;--red:#e6716b;--text:#dfe8e2;--muted:#7f9488;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:70px;min-height:100vh;}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0a100d 85%,rgba(10,16,13,0));padding:18px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .eyebrow{color:var(--green);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  h1{margin:2px 0 0;font-size:20px;font-weight:650;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px;}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
  .dot.off{background:var(--red);}
  .statuspill{font-size:11px;color:var(--muted);display:flex;align-items:center;}
  main{padding:16px;max-width:640px;margin:0 auto;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .btn{font-family:inherit;border:none;border-radius:10px;padding:14px 16px;font-size:15px;font-weight:600;cursor:pointer;width:100%;text-align:center;display:block;margin-bottom:10px;}
  .btn-primary{background:var(--green);color:#08130d;}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text);}
  .btn-ghost:active{background:#16221c;}
  .btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
  .btn-row{display:flex;gap:8px;}
  .btn-row .btn{flex:1;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px 14px;text-align:center;cursor:pointer;}
  .tile:active{background:#16221c;}
  .tile .icon{font-size:26px;margin-bottom:6px;}
  .tile .label{font-weight:600;font-size:14px;}
  label{font-size:12px;color:var(--muted);display:block;margin:12px 0 5px;}
  input[type=text],input[type=number],input[type=password],select,input[type=time],input[type=color]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:8px;font-size:15px;font-family:inherit;}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px;}
  .warn{font-size:12px;color:var(--amber);line-height:1.5;background:rgba(240,168,104,.08);border:1px solid rgba(240,168,104,.3);border-radius:8px;padding:10px;margin:10px 0;}
  .confirmed{font-size:11px;color:var(--green);margin-top:4px;}
  h2{font-size:17px;margin:0 0 12px;}
  h3{font-size:14px;margin:0 0 8px;color:var(--green);}
  .stageRow{border-bottom:1px solid var(--line);padding:10px 0;}
  .stageRow:last-child{border-bottom:none;}
  .stageName{font-weight:600;font-size:14px;}
  .stageMeta{font-size:12px;color:var(--muted);margin-top:3px;}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);}
  .kv .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--green);}
  .backbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--muted);font-size:13px;}
  .backbar span{cursor:pointer;}
  .navbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20;}
  .navbtn{flex:1;text-align:center;padding:6px 1px;border-radius:8px;font-size:10px;color:var(--muted);cursor:pointer;}
  .navbtn.active{color:var(--green);background:rgba(110,231,168,.08);}
  .navbtn .ic{font-size:17px;display:block;}
  .statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin:14px 0;}
  .statgrid .n{font-size:18px;font-weight:700;color:var(--green);}
  .statgrid .l{font-size:10px;color:var(--muted);margin-top:2px;}
  .toprow{display:flex;gap:10px;margin-bottom:14px;}
  .chip{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
  .switch{position:relative;width:40px;height:24px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;cursor:pointer;flex-shrink:0;}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--muted);border-radius:50%;transition:.15s;}
  .switch.on{background:rgba(110,231,168,.15);border-color:var(--green-dim);}
  .switch.on .knob{left:18px;background:var(--green);}
  .zoneGroup{margin-bottom:16px;}
  .zoneRow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);}
  .zoneRow:last-child{border-bottom:none;}
  .zoneLabel{font-size:13.5px;width:56px;flex-shrink:0;}
  .levelBtns{display:flex;gap:5px;flex:1;}
  .levelBtn{flex:1;text-align:center;padding:8px 2px;border-radius:8px;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;}
  .levelBtn.active{background:var(--green);color:#08130d;border-color:var(--green);font-weight:600;}
  .logEntry{border-bottom:1px solid var(--line);padding:10px 0;}
  .logEntry .tag{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--green);}
  .logEntry .time{font-size:11px;color:var(--muted);float:right;}
  textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:8px;font-size:15px;font-family:inherit;min-height:70px;resize:vertical;}
  .toast{position:fixed;bottom:80px;left:16px;right:16px;background:var(--panel);border:1px solid var(--green-dim);color:var(--green);padding:12px 14px;border-radius:10px;font-size:13px;text-align:center;z-index:30;display:none;}
  .sensorGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sensorCell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;}
  .sensorCell .lab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .sensorCell .val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--green);font-size:15px;margin-top:2px;}
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow" id="headerEyebrow">Mary Grow Box</div>
    <h1 id="headerTitle">Vitals</h1>
  </div>
  <div class="statuspill"><span class="dot" id="statusDot"></span><span id="statusText">Not connected</span></div>
</header>
<main id="main"></main>
<div class="navbar">
  <div class="navbtn" data-nav="vitals"><span class="ic">&#8962;</span>Vitals</div>
  <div class="navbtn" data-nav="sensors"><span class="ic">&#128202;</span>Sensors</div>
  <div class="navbtn" data-nav="manual"><span class="ic">&#9881;</span>Manual</div>
  <div class="navbtn" data-nav="log"><span class="ic">&#9998;</span>Log</div>
  <div class="navbtn" data-nav="connect"><span class="ic">&#128268;</span>Connect</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- CONFIRMED constants, decoded directly from Mary's own app code ---------- */
/* CHANGELOG
   v9 - Added the researched strain/cultivar library from your document: 18 cannabis
        strains (sativa/indica/hybrid/auto) and 8 vegetable cultivars, each with real
        phase-by-phase data. New "Search Library" entry point on Start a Grow - search
        by name, pick one, it skips the generic questions and uses the real researched
        values directly. RH/pH/EC/water-temp are shown as reference targets (this
        device has no dosing/pH hardware we've found, so those are for you to monitor
        manually, never sent to the device) - only light/temp/airflow/pump/duration
        actually get sent. Library is a plain, documented array at the top of the
        script specifically so new strains are easy to add later (see comment there).
        Caught and fixed a real bug before shipping: one strain's description text got
        truncated mid-parenthesis while I was building this, which would have broken
        the entire app (one syntax error anywhere kills the whole script). Verified
        this build by actually executing the library data with a real JS engine, not
        just checking that braces/parens looked balanced.
        Split the Log tab into "Plant Log" (your notes - watering, nutrients, etc) and
        "Troubleshooting" (automatic entries like grow started/ended, phase jumps) so
        the log you actually read day-to-day isn't buried in system noise.
   v8 - Corrected understanding: setRGB is the status indicator light (front/top),
        not a decorative "device color" - relabeled and given its own independent
        on/off toggle on Vitals (bedroom-friendly), separate from grow state.
        Added a real Water Change flow: tap "Next feed" on Vitals -> dim/off grow
        lights, start/stop pump, log notes, auto-restores lights + resets the
        countdown from the actual last logged change (not a fixed formula anymore).
        Log entries now sync to the relay too (previously only the grow itself did).
   v7 - "End this grow" now actually sends real OFF commands to the device (grow lights
        all zones off, water pump off, air pump off, AC off) before clearing the app's
        record - previously it only cleared app state and never touched the device at
        all. We don't have a confirmed dedicated "standby" system mode, so this sends
        explicit off-commands to every actuator instead.
   v6 - Relay bug found: it was saved as type "script" instead of "http" in val.town,
        so it never had a live URL - not something visible from the code itself. Fixed
        on val.town's side. Made pushRemoteState report success/failure instead of
        silently swallowing errors. Connect now auto-uploads a local grow to the relay
        if the relay has nothing saved yet (fixes exactly the stuck state you hit).
        Added a manual "Push this grow to the relay now" button as a fallback.
   v5 - Added relay-backed state storage (val.town SQLite) so the active grow survives
        Private Browsing and works from any device/browser, not just this phone's local
        storage. Push happens on start/end/jump/auto-correct; pull happens on Connect.
        REQUIRES: relay val.town code updated with the new /state/ routes (see chat).
   v4 - Added setSysMode('Growing') call when starting a grow (was previously missing
        entirely). Fixed activeGrow being saved only AFTER all network calls instead of
        before - could lose the grow record if the app was closed mid-sequence.
   v3 - Fixed real bug: phase_info_str was fetched but never used to reconcile the true
        current stage from the device. Added "View full plan" + manual jump-to-phase.
        Removed dead code (unused helper functions/constants).
   v2 - Corrected light zone / AC / air pump / eglass / color encodings using values
        decoded directly from Mary's own decompiled app (formatIntensity hex map,
        acModeMap, airPumpIntensityMap, etc). Switched units to Celsius. Added Sensors
        tab. Switched API param from "arg" to "args" to match the real SDK.
   v1 - First working version: Vitals dashboard, plant/stage picker wizard, manual
        control, log. Talks to Particle via a val.town relay (browser CORS workaround).
*/
const APP_VERSION = 'v9 - research strain library + split logs';
const LEVELS = ['Off','Low','Medium','High'];
const LEVEL_HEX = {Off:'00',Low:'55',Medium:'AA',High:'FF'};
const AC_MODES = ['Off','A/C','Heating'];
const AC_MODE_VALUE = {Off:'0','A/C':'1',Heating:'2'};
const PUMP_LEVELS = ['Off','Quiet','Default','Max'];
const PUMP_VALUE = {Off:'0',Quiet:'25',Default:'40',Max:'110'};
const AIRFLOW_VALUE = {Low:200,Normal:500,Max:850};
const RATIO_VALUE = {Off:0,'30m Interval':50,'Always On':100};

function localTimeToUtcSeconds(hhmm){
  const p=hhmm.split(':').map(Number);
  const now=new Date(); now.setHours(p[0],p[1],0,0);
  return now.getUTCHours()*3600 + now.getUTCMinutes()*60;
}
function utcSecondsToLocalClock(sec){
  if(sec===undefined||sec===null) return '-';
  const d=new Date(); d.setUTCHours(0,0,0,0); d.setUTCSeconds(sec);
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}

/* ---------- grow database (temps in Celsius, airflow/pump as real tiers, LED as levels) ---------- */
const VEG_DB = {
  tomato:{label:'Tomato', stages:[
    {name:'Seedling', PhaseMinDur:7,PhaseMaxDur:14, lightHours:16, tempDay:24,tempNight:20, airflow:'Low', pump:'30m Interval', plantHeight:10, coldLevel:'Medium',warmLevel:'Low'},
    {name:'Vegetative', PhaseMinDur:14,PhaseMaxDur:28, lightHours:18, tempDay:25,tempNight:20, airflow:'Normal', pump:'30m Interval', plantHeight:30, coldLevel:'High',warmLevel:'Low'},
    {name:'Flowering / Fruiting', PhaseMinDur:21,PhaseMaxDur:45, lightHours:14, tempDay:22,tempNight:18, airflow:'Max', pump:'Always On', plantHeight:null, coldLevel:'Medium',warmLevel:'High'}
  ]},
  leafy:{label:'Leafy Greens & Herbs', stages:[
    {name:'Seedling', PhaseMinDur:5,PhaseMaxDur:10, lightHours:14, tempDay:20,tempNight:17, airflow:'Low', pump:'30m Interval', plantHeight:5, coldLevel:'Medium',warmLevel:'Low'},
    {name:'Growth / Harvest', PhaseMinDur:14,PhaseMaxDur:35, lightHours:16, tempDay:21,tempNight:17, airflow:'Normal', pump:'30m Interval', plantHeight:null, coldLevel:'High',warmLevel:'Low'}
  ]},
  peppers:{label:'Peppers & Chilies', stages:[
    {name:'Seedling', PhaseMinDur:10,PhaseMaxDur:21, lightHours:16, tempDay:26,tempNight:20, airflow:'Low', pump:'30m Interval', plantHeight:10, coldLevel:'Medium',warmLevel:'Low'},
    {name:'Vegetative', PhaseMinDur:21,PhaseMaxDur:35, lightHours:18, tempDay:27,tempNight:20, airflow:'Normal', pump:'30m Interval', plantHeight:25, coldLevel:'High',warmLevel:'Low'},
    {name:'Flowering / Fruiting', PhaseMinDur:30,PhaseMaxDur:60, lightHours:13, tempDay:24,tempNight:18, airflow:'Max', pump:'Always On', plantHeight:null, coldLevel:'Medium',warmLevel:'High'}
  ]},
  strawberry:{label:'Strawberries', stages:[
    {name:'Vegetative', PhaseMinDur:14,PhaseMaxDur:30, lightHours:16, tempDay:22,tempNight:17, airflow:'Normal', pump:'30m Interval', plantHeight:15, coldLevel:'High',warmLevel:'Low'},
    {name:'Flowering / Fruiting', PhaseMinDur:21,PhaseMaxDur:200, lightHours:13, tempDay:20,tempNight:16, airflow:'Normal', pump:'Always On', plantHeight:null, coldLevel:'Medium',warmLevel:'High'}
  ]}
};
const HEIGHT_BY_TYPE = {indica:40, hybrid:55, sativa:70, unknown:50};
function cannabisStages(auto, type, flowerWeeks){
  const h = HEIGHT_BY_TYPE[type]||50;
  const lightHrs = auto ? 20 : 18;
  const flowerDays = Math.round((flowerWeeks||8)*7);
  const stages = [
    {name:'Seedling', PhaseMinDur:7,PhaseMaxDur:14, lightHours:auto?20:18, tempDay:26,tempNight:21, airflow:'Low', pump:'30m Interval', plantHeight:8, coldLevel:'Medium',warmLevel:'Low'},
    {name:'Vegetative', PhaseMinDur:14,PhaseMaxDur:28, lightHours:lightHrs, tempDay:auto?26:27,tempNight:20, airflow:'Normal', pump:'30m Interval', plantHeight:h, coldLevel:'High',warmLevel:'Low'}
  ];
  if(auto){
    stages.push({name:'Flower', PhaseMinDur:21,PhaseMaxDur:35, lightHours:20, tempDay:23,tempNight:18, airflow:'Max', pump:'Always On', plantHeight:null, coldLevel:'Low',warmLevel:'High'});
  } else {
    stages.push({name:'Flower Stretch', PhaseMinDur:10,PhaseMaxDur:14, lightHours:12, tempDay:24,tempNight:19, airflow:'Max', pump:'Always On', plantHeight:null, coldLevel:'Low',warmLevel:'High'});
    stages.push({name:'Flower Mid/Late', PhaseMinDur:21,PhaseMaxDur:Math.max(21,flowerDays-24), lightHours:12, tempDay:23,tempNight:18, airflow:'Max', pump:'Always On', plantHeight:null, coldLevel:'Low',warmLevel:'High'});
    stages.push({name:'Flush', PhaseMinDur:10,PhaseMaxDur:14, lightHours:12, tempDay:22,tempNight:17, airflow:'Max', pump:'30m Interval', plantHeight:null, coldLevel:'Low',warmLevel:'High'});
  }
  return stages;
}

/* ---------- remote state (survives Private Browsing / different devices) ---------- */
function stateUrl(){ return state.relay.replace(/\/+$/,'') + '/state/' + state.deviceId; }
async function pushRemoteState(){
  if(!state.relay || !state.deviceId) return false;
  try{
    const res = await fetch(stateUrl(), {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({activeGrow: state.activeGrow, lightLevels: state.lightLevels, eglassClear: state.eglassClear, deviceColor: state.deviceColor, statusLightsOff: state.statusLightsOff, log: state.log})});
    return res.ok;
  }catch(e){ return false; }
}
async function pullRemoteState(){
  if(!state.relay || !state.deviceId) return false;
  try{
    const res = await fetch(stateUrl());
    const json = await res.json();
    if(json && json.data){
      const remote = JSON.parse(json.data);
      if(remote.activeGrow!==undefined) state.activeGrow = remote.activeGrow;
      if(remote.lightLevels) state.lightLevels = remote.lightLevels;
      if(remote.eglassClear!==undefined) state.eglassClear = remote.eglassClear;
      if(remote.deviceColor) state.deviceColor = remote.deviceColor;
      if(remote.statusLightsOff!==undefined) state.statusLightsOff = remote.statusLightsOff;
      if(remote.log) state.log = remote.log;
      save();
      return true;
    }
  }catch(e){ /* no remote state saved yet, or relay doesn't have /state/ routes - not fatal */ }
  return false;
}


/* ---------- RESEARCHED STRAIN/CULTIVAR LIBRARY ----------
   Sourced from user-provided research document. targetRH/targetPH/targetEC/targetWaterTemp
   are REFERENCE ONLY - this device has no pH/EC sensors or nutrient dosing hardware we've
   found, so those are shown to you to monitor/dose manually, never sent to the device.
   Only PhaseMinDur/PhaseMaxDur/lightHours/tempDay/tempNight/airflow/pump/coldLevel/warmLevel
   actually get sent to the device (same schema as the built-in generic plants).

   TO ADD A NEW STRAIN: copy one whole {...} block below and edit the values. Minimum need:
   name, category, type (sativa/indica/hybrid - cannabis only), auto (true/false - cannabis
   only), stages: [ {name, PhaseMinDur, PhaseMaxDur, lightHours, tempDay, tempNight,
   airflow:'Low'|'Normal'|'Max', pump:'Off'|'30m Interval'|'Always On', plantHeight:null,
   coldLevel:'Off'|'Low'|'Medium'|'High', warmLevel: same options} ]. targetRH/PH/EC/WaterTemp
   and tip/harvest are optional extras shown in the UI, safe to omit if you don't have them.
------------------------------------------------------------------------------------------ */
const STRAIN_LIBRARY = [

function fmtTemp(c){
  if(c===undefined||c===null) return '-';
  if(state.tempUnit==='F') return Math.round(c*9/5+32)+'\u00b0F';
  return c+'\u00b0C';
}
function stopAutoRefresh(){ if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null; } }
function startAutoRefreshIfNeeded(){
  stopAutoRefresh();
  if(!state.autoRefresh) return;
  if(state.screen==='vitals') refreshTimer=setInterval(function(){ if(state.screen==='vitals') renderVitals(document.getElementById('main')); }, 15000);
  if(state.screen==='sensors') refreshTimer=setInterval(function(){ if(state.screen==='sensors') renderSensors(document.getElementById('main')); }, 15000);
}

/* ---------- API ---------- */
function apiBase(){ return state.relay.replace(/\/+$/,'') + '/v1/products/mymary-43995/devices'; }
async function apiGet(path){
  if(!token){ throw new Error('Not connected on this page load - go to Connect and re-enter your token, then try again.'); }
  const res=await fetch(apiBase()+'/'+path,{headers:{'Authorization':'Bearer '+token}});
  const text=await res.text(); var data; try{data=JSON.parse(text);}catch(e){throw new Error(text.slice(0,150));}
  if(!res.ok) throw new Error(data.error_description||data.error||text.slice(0,150));
  return data;
}
async function apiCall(fn,arg){
  if(!token){ throw new Error('Not connected on this page load - go to Connect and re-enter your token, then try again.'); }
  const res=await fetch(apiBase()+'/'+state.deviceId+'/'+fn,{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/x-www-form-urlencoded'},body:'args='+encodeURIComponent(arg)});
  const text=await res.text(); var data; try{data=JSON.parse(text);}catch(e){throw new Error(text.slice(0,150));}
  if(!res.ok) throw new Error(data.error_description||data.error||text.slice(0,150));
  return data.return_value;
}
async function getVar(name){ return (await apiGet(state.deviceId+'/'+name)).result; }
async function connect(){
  try{
    const data = await apiGet(state.deviceId);
    state.connected = !!data.connected;
    save(); renderHeader();
    toast(state.connected ? 'Connected' : 'Device offline right now');
  }catch(e){ state.connected=false; save(); renderHeader(); toast('Connect failed: '+e.message); }
}

/* ---------- phase push (confirmed encoding) ---------- */
function ledBytes3(level){ const h=LEVEL_HEX[level]; return h+h+h; }
async function pushStage(stage, phaseIndex, cycleId){
  const onSec = localTimeToUtcSeconds(state.activeGrow.lightOn||'06:00');
  const offSec = (onSec + stage.lightHours*3600) % 86400;
  const payload = {
    cycle_id: cycleId, selected_phase_index: phaseIndex,
    PhaseMinDur: stage.PhaseMinDur, PhaseMaxDur: stage.PhaseMaxDur,
    Cold_LED_BT: ledBytes3(stage.coldLevel), Warm_LED_BT: ledBytes3(stage.warmLevel),
    Sunrise_T: onSec, Sunset_T: offSec, BT_FADE_TIME: 30,
    AC_Temp_Day: stage.tempDay, AC_Temp_Night: stage.tempNight,
    Airflow: AIRFLOW_VALUE[stage.airflow], PUMP_ON_RATIO: RATIO_VALUE[stage.pump],
    Passing_Plt_Ht: stage.plantHeight===null?0:stage.plantHeight
  };
  const ret = await apiCall('updPhzInfo', JSON.stringify(payload));
  await apiCall('goToPhzNum', String(phaseIndex));
  return ret;
}

function parseJsonSafe(str){ if(!str) return null; try{ return JSON.parse(str); }catch(e){ return null; } }
function daysUntilNextChange(g){
  if(!g) return null;
  const last = g.lastWaterChange || g.startedAt;
  const daysSince = Math.floor((Date.now()-last)/86400000);
  const iv = state.waterChangeIntervalDays;
  return (iv - (daysSince % iv)) || iv;
}

  box.innerHTML = '<div class="card">'+results.map(function(x){
    const sub = x.category==='cannabis' ? (x.type+(x.auto?' - Autoflower':' - Photoperiod')) : x.crop;
    return '<button class="btn btn-ghost" onclick="pickFromLibrary(\''+x.category+'\',\''+x.name.replace(/'/g,"\\'")+'\')">'+x.name+' <span style="color:var(--muted);font-weight:400">&middot; '+sub+'</span></button>';
  }).join('')+'</div>';
};
window.pickFromLibrary = function(category, name){
  const src = category==='cannabis' ? STRAIN_LIBRARY : VEGETABLE_LIBRARY;
  const item = src.find(function(x){ return x.name===name; });
  if(!item) return;
  const sub = category==='cannabis' ? (item.type+(item.auto?' Autoflower':' Photoperiod')) : item.crop;
  state.wizard = {categoryLabel:(category==='cannabis'?'Cannabis':'Vegetable')+' \u00b7 '+sub+' \u00b7 from research library', plantLabel:item.name, stages:item.stages, tip:item.tip};
  go('wizardStart');
};
function renderWizardVeg(m){
  var rows='';
  for(var k in VEG_DB){ rows += '<button class="btn btn-ghost" onclick="pickVeg(\''+k+'\')">'+VEG_DB[k].label+'</button>'; }
  m.innerHTML = '<div class="backbar"><span onclick="go(\'wizardCategory\')">&larr; Back</span></div><h2>Choose a plant</h2><div class="card">'+rows+'</div>';
}
window.pickVeg = function(key){
  const db=VEG_DB[key];
  state.wizard = {categoryLabel:'Vegetable', plantLabel:db.label, stages:db.stages};
  go('wizardStart');
};
function renderWizardCannabis(m){
  m.innerHTML =
  '<div class="backbar"><span onclick="go(\'wizardCategory\')">&larr; Back</span></div>'+
  '<h2>Cannabis details</h2><div class="card">'+
  '<label>Strain name (label only)</label><input type="text" id="strainName" placeholder="e.g. Blue Dream">'+
  '<label>Photoperiod or autoflower?</label><select id="autoSel"><option value="0">Photoperiod</option><option value="1">Autoflower</option></select>'+
  '<label>Type (affects expected height, not climate)</label><select id="typeSel"><option value="hybrid">Hybrid</option><option value="indica">Indica-dominant</option><option value="sativa">Sativa-dominant</option><option value="unknown">Not sure</option></select>'+
  '<label>Breeder\'s stated flowering time (weeks)</label><input type="number" id="flowerWeeks" value="8" min="5" max="16">'+
  '<button class="btn btn-primary" style="margin-top:14px" onclick="pickCannabis()">Continue</button></div>';
}
window.pickCannabis = function(){
  const strain = document.getElementById('strainName').value.trim() || 'Unnamed strain';
  const auto = document.getElementById('autoSel').value==='1';
  const type = document.getElementById('typeSel').value;
  const weeks = Number(document.getElementById('flowerWeeks').value)||8;
  state.wizard = {categoryLabel:'Cannabis \u00b7 '+(auto?'Autoflower':'Photoperiod')+' \u00b7 '+type, plantLabel:strain, stages:cannabisStages(auto,type,weeks)};
  go('wizardStart');
};
function renderWizardStart(m){
  const stages=state.wizard.stages;
  var rows = '<button class="btn btn-ghost" onclick="pickStartIndex(0)">Seed / Just germinated</button>';
  for(var i=1;i<stages.length;i++){ rows += '<button class="btn btn-ghost" onclick="pickStartIndex('+i+')">Already at: '+stages[i].name+'</button>'; }
  m.innerHTML = '<div class="backbar"><span onclick="go(\'vitals\')">&larr; Home</span></div><h2>Where are you starting?</h2><div class="card">'+rows+'</div>';
}
window.pickStartIndex = function(i){
  state.wizard.lightOn='06:00';
  state.wizard.startIndex=i;
  go('wizardConfirm');
};
function renderWizardConfirm(m){
  const w=state.wizard;
  var rows='';
  for(var i=0;i<w.stages.length;i++){
    var s=w.stages[i];
    var ref = [];
    if(s.targetRH!=null) ref.push('target RH '+s.targetRH+'%');
    if(s.targetPH!=null) ref.push('target pH '+s.targetPH);
    if(s.targetEC!=null) ref.push('target EC '+s.targetEC+' mS/cm');
    if(s.targetWaterTemp!=null) ref.push('water temp '+s.targetWaterTemp+'&deg;C');
    if(s.harvest) ref.push('harvest: '+s.harvest);
    rows += '<div class="stageRow"'+(i<w.startIndex?' style="opacity:.4"':'')+'>'+
      '<div class="stageName">'+(i+1)+'. '+s.name+(i===w.startIndex?' &larr; starting here':'')+'</div>'+
      '<div class="stageMeta">'+s.PhaseMinDur+'&ndash;'+s.PhaseMaxDur+' days &middot; '+s.lightHours+'h light &middot; '+s.tempDay+'&deg;/'+s.tempNight+'&deg;C day/night &middot; airflow '+s.airflow+' &middot; pump '+s.pump+(s.plantHeight?(' &middot; advances at '+s.plantHeight+'cm'):'')+'</div>'+
      (ref.length?'<div class="stageMeta" style="color:var(--green)">Reference only (not sent to device, no dosing hardware found): '+ref.join(' &middot; ')+'</div>':'')+
      '</div>';
  }
  m.innerHTML =
  '<div class="backbar"><span onclick="go(\'wizardStart\')">&larr; Back</span></div>'+
  '<h2>Review the plan</h2>'+
  '<div class="card"><label>Lights on time (your local time)</label><input type="time" id="lightOn" value="'+w.lightOn+'"></div>'+
  '<div class="card"><h3>'+w.plantLabel+'</h3>'+rows+'</div>'+
  (w.tip?('<div class="card"><h3>Notes from the research</h3><p class="hint">'+w.tip+'</p></div>'):'')+
  '<div class="warn">'+(w.tip!==undefined?'From your research library &mdash; device commands (light/temp/airflow/pump) are confirmed-format, real values from the source. RH/pH/EC/water-temp are reference targets for you to monitor/dose manually.':'Durations, temps, and tiers are best-effort generic defaults &mdash; the encoding format itself is confirmed from the real app, only the specific numbers may need adjusting once you watch it run.')+'</div>'+
  '<button class="btn btn-primary" onclick="confirmStart()">Start Growing</button>';
}
window.confirmStart = async function(){
  const w=state.wizard;
  w.lightOn = document.getElementById('lightOn').value;
  const cycleId = 'cyc_'+Date.now();
  state.activeGrow = {categoryLabel:w.categoryLabel, plantLabel:w.plantLabel, stages:w.stages, currentIndex:w.startIndex, cycleId:cycleId, lightOn:w.lightOn, startedAt:Date.now(), lastWaterChange:Date.now()};
  save(); pushRemoteState(); /* save immediately, before any network calls - so closing the app mid-sequence can't lose this */
  try{
    toast('Telling device it\'s actively growing...');
    await apiCall('setSysMode', 'Growing');
    toast('Sending full plan to device (all stages)...');
    var lastRet = null;
    for(var i=0;i<w.stages.length;i++){
      lastRet = await pushStage(w.stages[i], i, cycleId);
      await new Promise(function(r){ setTimeout(r, 400); });
    }
    await apiCall('goToPhzNum', String(w.startIndex));
    addLog('System', 'Started grow: '+w.plantLabel+' at stage "'+w.stages[w.startIndex].name+'" ('+w.stages.length+' phases pushed)','system');
    save();
    toast('Sent all '+w.stages.length+' phases (last code '+lastRet+'). Check Vitals in a minute.');
    go('vitals');
  }catch(e){ toast('Partially sent - grow is saved, but: '+e.message); go('vitals'); }
};

/* ---------- LOG ---------- */
function addLog(tag, note, section){ state.log.unshift({tag:tag,note:note,time:Date.now(),section:section||'plant'}); save(); pushRemoteState(); }
function renderLog(m){
  if(!state.logView) state.logView = 'plant';
  const filtered = state.log.filter(function(e){ return (e.section||'plant')===state.logView; });
  var rows='';
  if(filtered.length===0){ rows = '<p class="hint">No entries yet.</p>'; }
  else{
    for(var i=0;i<filtered.length;i++){
      var e=filtered[i];
      rows += '<div class="logEntry"><span class="tag">'+e.tag+'</span><span class="time">'+new Date(e.time).toLocaleString()+'</span><div>'+e.note+'</div></div>';
    }
  }
  m.innerHTML =
  '<div class="btn-row" style="margin-bottom:14px">'+
    '<button class="btn '+(state.logView==='plant'?'btn-primary':'btn-ghost')+'" onclick="setLogView(\'plant\')">Plant Log</button>'+
    '<button class="btn '+(state.logView==='system'?'btn-primary':'btn-ghost')+'" onclick="setLogView(\'system\')">Troubleshooting</button>'+
  '</div>'+
  (state.logView==='plant'?(
  '<div class="card"><h3>Add entry</h3>'+
  '<select id="logTag"><option>General</option><option>Watering</option><option>Nutrients</option><option>Maintenance</option><option>Reminder</option></select>'+
  '<textarea id="logNote" placeholder="What did you do?"></textarea>'+
  '<button class="btn btn-primary" style="margin-top:10px" onclick="submitLog()">Add to log</button></div>'
  ):'<div class="hint">Automatic entries from starting/ending grows, phase jumps, and sync events &mdash; not user-editable.</div>')+
  '<div class="card"><h3>History</h3>'+rows+'</div>';
}
window.setLogView = function(v){ state.logView = v; render(); };
window.submitLog = function(){
  const tag=document.getElementById('logTag').value, note=document.getElementById('logNote').value.trim();
  if(!note) return;
  addLog(tag,note,'plant'); go('log'); toast('Logged');
};

/* ---------- nav ---------- */
document.querySelectorAll('.navbtn').forEach(function(b){ b.addEventListener('click',function(){ go(b.dataset.nav); }); });
render();
</script>
</body>
</html>
